<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
</head>
<body>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
            
    </style>

    <h2>Lista de Produtos</h2>

    <table id="produtosTable" border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>
        <tbody>
            <!-- Linhas de produtos serão inseridas aqui dinamicamente -->
        </tbody>
    </table>

    <!-- Mensagem de Erro -->
    <div id="errorMessage" style="color: red; display: none;">
        Ocorreu um erro ao carregar a lista de produtos.
    </div>

    <!-- Total de Produtos -->
    <div id="totalProdutos" style="margin-top: 20px;">
        Total de Produtos: <span id="productCount">0</span>
    </div>

    <!-- Script para buscar e exibir produtos -->
    <script>
        // Função para listar produtos
        function listarProdutos() {
            //Faz uma requisição para endpoint da API
            fetch('http://localhost:8080/produtos')// URL da API
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erro na requisição: ' + response.status);
                    }
                    return response.json();// Converte a resposta para JSON
                })
                .then(data => {
                    const produtosTableBody = document.getElementById('produtosTable').getElementsByTagName('tbody')[0];
                    produtosTableBody.innerHTML = ''; // Limpa o corpo da tabela
                    
                    data.forEach(produto => {
                        const row = produtosTableBody.insertRow();
                        row.insertCell(0).innerText = produto.id;
                        row.insertCell(1).innerText = produto.nome;
                        row.insertCell(2).innerText = produto.quantidade;
                        row.insertCell(3).innerText = produto.preco.toFixed(2);
                
                    });

                    // Atualiza o total de produtos
                    document.getElementById('productCount').innerText = data.length;
                })
                .catch(error => {
                    console.error('Erro ao buscar produtos:', error);
                    document.getElementById('errorMessage').style.display = 'block';
                });
        }
        // Chama a função para listar produtos quando a página carregar
        window.onload = listarProdutos;
    
    </script>

</body>
</html>
